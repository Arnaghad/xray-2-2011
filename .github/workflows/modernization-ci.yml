name: Modernization CI (Windows x64 & Linux x64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-windows-x64:
    name: CPU Build & CTest (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mimalloc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bullet
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-asio
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Add UCRT64 tools to PATH
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Resolve-Path (Join-Path $env:MSYS2_ROOT 'ucrt64/bin')).Path |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure CMake preset
        shell: pwsh
        run: |
          cmake -S sources --preset "windows-x64-${{ matrix.config }}"

      - name: Build CPU test targets and asset cooker
        working-directory: sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../build/ci-artifacts | Out-Null
          cmake --build --preset "windows-x64-${{ matrix.config }}-cpu-tests" --parallel 2>&1 |
            Tee-Object -FilePath "../build/ci-artifacts/build-${{ matrix.config }}-cpu.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CPU CTest suite
        working-directory: sources
        shell: pwsh
        run: |
          ctest --preset "windows-x64-${{ matrix.config }}-cpu" `
            --output-junit "${{ github.workspace }}/build/ci-artifacts/junit-${{ matrix.config }}-cpu.xml"

      - name: Collect baseline metrics
        if: always()
        shell: pwsh
        run: |
          python sources/tools/ci/collect_build_baseline.py `
            --preset "windows-x64-${{ matrix.config }}" `
            --build-dir "build/presets/windows-x64-${{ matrix.config }}" `
            --build-log "build/ci-artifacts/build-${{ matrix.config }}-cpu.log" `
            --ctest-junit "build/ci-artifacts/junit-${{ matrix.config }}-cpu.xml" `
            --output "build/ci-artifacts/baseline-${{ matrix.config }}-cpu.json"

      - name: Upload CPU CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.config }}
          path: build/ci-artifacts/

  full-sdk-self-hosted:
    name: Full Engine & SDK Package (${{ matrix.config }})
    runs-on: [self-hosted, xray-dcc]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake preset
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cmake -S sources --preset "windows-x64-${{ matrix.config }}"

      - name: Build full engine and SDK
        working-directory: sources
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path ../build/ci-artifacts | Out-Null
          cmake --build --preset "windows-x64-${{ matrix.config }}" --parallel 2>&1 |
            Tee-Object -FilePath "../build/ci-artifacts/build-${{ matrix.config }}-full.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all CTest suites
        working-directory: sources
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          ctest --preset "windows-x64-${{ matrix.config }}-all" `
            --output-junit "${{ github.workspace }}/build/ci-artifacts/junit-${{ matrix.config }}-all.xml"

      - name: Package SDK runtime and verify without MSYS2 in PATH
        shell: pwsh
        run: |
          $pkgDir = "build/ci-artifacts/sdk-package-${{ matrix.config }}"
          python sources/tools/sdk/package-sdk-runtime.py `
            --config "${{ matrix.config }}" `
            --build-dir "build/presets/windows-x64-${{ matrix.config }}" `
            --output $pkgDir `
            --clean
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            & "$pkgDir\bin\xray_asset_cook_cli.exe" --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $savedPath
          }

      - name: Collect full baseline metrics
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          python sources/tools/ci/collect_build_baseline.py `
            --preset "windows-x64-${{ matrix.config }}" `
            --build-dir "build/presets/windows-x64-${{ matrix.config }}" `
            --build-log "build/ci-artifacts/build-${{ matrix.config }}-full.log" `
            --ctest-junit "build/ci-artifacts/junit-${{ matrix.config }}-all.xml" `
            --output "build/ci-artifacts/baseline-${{ matrix.config }}-full.json"

      - name: Upload full SDK CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sdk-${{ matrix.config }}
          path: build/ci-artifacts/

  cpu-linux-x64:
    name: Linux x64 CPU Build & CTest (${{ matrix.config }})
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - name: Install Linux x64 build dependencies and .NET 11 SDK
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git python3 gcc-c++ cmake ninja-build lua-devel boost-devel \
            SDL3-devel mimalloc-devel zlib-ng-compat-devel bullet-devel \
            vulkan-headers vulkan-loader-devel libogg-devel libvorbis-devel \
            asio-devel pkgconf-pkg-config wayland-devel libxkbcommon-devel \
            libX11-devel libXext-devel binutils findutils curl tar gzip ca-certificates
          if dnf install -y dotnet-sdk-11.0; then
            echo "DOTNET_ROOT=/usr/lib64/dotnet" >> "$GITHUB_ENV"
          else
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 11.0 --quality daily --install-dir /usr/local/dotnet
            ln -sf /usr/local/dotnet/dotnet /usr/local/bin/dotnet
            echo "DOTNET_ROOT=/usr/local/dotnet" >> "$GITHUB_ENV"
            echo "/usr/local/dotnet" >> "$GITHUB_PATH"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Linux CMake preset
        run: cmake -S sources --preset "linux-x64-${{ matrix.config }}"

      - name: Build Linux CPU test targets and asset cooker
        working-directory: sources
        run: |
          mkdir -p ../build/ci-artifacts
          cmake --build --preset "linux-x64-${{ matrix.config }}-cpu-tests" --parallel 2>&1 | \
            tee "../build/ci-artifacts/build-linux-${{ matrix.config }}-cpu.log"

      - name: Run Linux CPU CTest suite
        working-directory: sources
        run: |
          ctest --preset "linux-x64-${{ matrix.config }}-cpu" \
            --output-junit "${{ github.workspace }}/build/ci-artifacts/junit-linux-${{ matrix.config }}-cpu.xml"

      - name: Collect Linux baseline metrics
        if: always()
        run: |
          python3 sources/tools/ci/collect_build_baseline.py \
            --preset "linux-x64-${{ matrix.config }}" \
            --build-dir "build/presets/linux-x64-${{ matrix.config }}" \
            --build-log "build/ci-artifacts/build-linux-${{ matrix.config }}-cpu.log" \
            --ctest-junit "build/ci-artifacts/junit-linux-${{ matrix.config }}-cpu.xml" \
            --output "build/ci-artifacts/baseline-linux-${{ matrix.config }}-cpu.json"

      - name: Upload Linux CPU CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-linux-${{ matrix.config }}
          path: build/ci-artifacts/

  vulkan-wayland-linux-x64:
    name: Linux x64 Headless Vulkan (Wayland Weston + Lavapipe & X11 Xvfb)
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - name: Install Linux Vulkan, Wayland, Xvfb and build packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git python3 gcc-c++ cmake ninja-build lua-devel boost-devel \
            SDL3-devel mimalloc-devel zlib-ng-compat-devel bullet-devel \
            vulkan-headers vulkan-loader-devel libogg-devel libvorbis-devel \
            asio-devel pkgconf-pkg-config wayland-devel libxkbcommon-devel \
            libX11-devel libXext-devel mesa-vulkan-drivers \
            vulkan-validation-layers weston xorg-x11-server-Xvfb binutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build Vulkan surface & Sync2 contracts
        working-directory: sources
        run: |
          cmake --preset linux-x64-release
          cmake --build --preset linux-x64-release --target \
            xray_vulkan_sdl3_surface_contract \
            xray_vulkan_sync2_dynamic_rendering_contract \
            --parallel

      - name: Run Vulkan contracts under headless Weston (Wayland + Lavapipe)
        working-directory: .
        run: |
          export XDG_RUNTIME_DIR="/tmp/xdg-runtime-ci"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-ci --idle-time=0 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-ci" ]] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-ci
          export SDL_VIDEODRIVER=wayland
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          ./build/presets/linux-x64-release/binaries/xray_vulkan_sdl3_surface_contract
          ./build/presets/linux-x64-release/binaries/xray_vulkan_sync2_dynamic_rendering_contract

      - name: Run Vulkan contracts under Xvfb (X11 + Lavapipe)
        run: |
          export SDL_VIDEODRIVER=x11
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          xvfb-run -a ./build/presets/linux-x64-release/binaries/xray_vulkan_sdl3_surface_contract
          xvfb-run -a ./build/presets/linux-x64-release/binaries/xray_vulkan_sync2_dynamic_rendering_contract
